name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject public web config
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
        run: |
          node -e "const fs=require('fs'); const key=process.env.GROQ_API_KEY||''; const model=process.env.GROQ_MODEL||'llama-3.3-70b-versatile'; const js='window.APP_CONFIG = {\\n  groqKey: ' + JSON.stringify(key) + ',\\n  groqModel: ' + JSON.stringify(model) + '\\n};\\n'; fs.mkdirSync('assets',{recursive:true}); fs.writeFileSync('assets/config.js', js);"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
